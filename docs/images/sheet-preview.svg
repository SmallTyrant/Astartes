<svg width="900" height="370" viewBox="0 0 900 370" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="fadeBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="white" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Window chrome -->
  <rect width="900" height="370" fill="#E2E8F0" rx="12"/>
  <rect width="900" height="36" fill="#CBD5E1" rx="12"/>
  <rect y="24" width="900" height="12" fill="#CBD5E1"/>
  <circle cx="22" cy="18" r="6" fill="#EF4444"/>
  <circle cx="44" cy="18" r="6" fill="#F59E0B"/>
  <circle cx="66" cy="18" r="6" fill="#10B981"/>
  <text x="450" y="23" text-anchor="middle" font-size="12" fill="#64748B" font-weight="500">goodnotes.xlsx — TC 시트 미리보기</text>

  <!-- Spreadsheet body -->
  <rect x="0" y="36" width="900" height="294" fill="white"/>

  <!-- Row 1: empty (Excel row 1) -->
  <rect x="0" y="36" width="900" height="24" fill="#FAFAFA"/>
  <text x="20" y="53" font-size="10" fill="#D1D5DB">1</text>

  <!-- Row 2: Header — #B6D7A8 -->
  <rect x="0" y="60" width="900" height="30" fill="#B6D7A8"/>
  <text x="20" y="80" font-size="10" fill="#6B7280">2</text>
  <text x="82"  y="80" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="700">TC ID</text>
  <text x="152" y="80" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="700">priority</text>
  <text x="255" y="80" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="700">1 Step</text>
  <text x="375" y="80" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="700">2 Step</text>
  <text x="480" y="80" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="700">3 Step</text>
  <text x="572" y="80" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="700">pre-condition</text>
  <text x="700" y="80" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="700">기대결과</text>
  <text x="808" y="80" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="700">result</text>
  <text x="872" y="80" text-anchor="middle" font-size="10" fill="#1F2937" font-weight="700">Jira</text>

  <!-- Row 3: high (red) -->
  <rect x="0"   y="90" width="900" height="30" fill="white"/>
  <rect x="112" y="91" width="78"  height="28" fill="#E06666"/>
  <text x="20"  y="110" font-size="10" fill="#D1D5DB">3</text>
  <text x="82"  y="110" text-anchor="middle" font-size="10" fill="#374151">TC-001</text>
  <text x="152" y="110" text-anchor="middle" font-size="10" fill="white" font-weight="700">high</text>
  <text x="255" y="110" text-anchor="middle" font-size="10" fill="#374151">'로그인' 버튼을 탭한다</text>
  <text x="375" y="110" text-anchor="middle" font-size="10" fill="#374151">이메일을 입력한다</text>
  <text x="480" y="110" text-anchor="middle" font-size="10" fill="#374151">비밀번호를 입력한다</text>
  <text x="572" y="110" text-anchor="middle" font-size="10" fill="#374151">앱 실행 완료</text>
  <text x="700" y="110" text-anchor="middle" font-size="10" fill="#374151">홈 화면이 표시되어야 한다</text>
  <rect x="772" y="93" width="70" height="24" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="807" y="109" text-anchor="middle" font-size="10" fill="#16A34A" font-weight="600">Pass ▾</text>

  <!-- Row 4: mid (yellow) -->
  <rect x="0"   y="120" width="900" height="30" fill="#FAFAFA"/>
  <rect x="112" y="121" width="78"  height="28" fill="#FFD966"/>
  <text x="20"  y="140" font-size="10" fill="#D1D5DB">4</text>
  <text x="82"  y="140" text-anchor="middle" font-size="10" fill="#374151">TC-002</text>
  <text x="152" y="140" text-anchor="middle" font-size="10" fill="#374151" font-weight="700">mid</text>
  <text x="255" y="140" text-anchor="middle" font-size="10" fill="#374151">'프로필' 탭을 탭한다</text>
  <text x="375" y="140" text-anchor="middle" font-size="10" fill="#374151">'설정' 버튼을 탭한다</text>
  <text x="480" y="140" text-anchor="middle" font-size="10" fill="#9CA3AF">—</text>
  <text x="572" y="140" text-anchor="middle" font-size="10" fill="#374151">로그인 상태</text>
  <text x="700" y="140" text-anchor="middle" font-size="10" fill="#374151">설정 화면이 열려야 한다</text>
  <rect x="772" y="123" width="70" height="24" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="807" y="139" text-anchor="middle" font-size="10" fill="#EF4444" font-weight="600">Fail ▾</text>

  <!-- Row 5: low (green) -->
  <rect x="0"   y="150" width="900" height="30" fill="white"/>
  <rect x="112" y="151" width="78"  height="28" fill="#93C47D"/>
  <text x="20"  y="170" font-size="10" fill="#D1D5DB">5</text>
  <text x="82"  y="170" text-anchor="middle" font-size="10" fill="#374151">TC-003</text>
  <text x="152" y="170" text-anchor="middle" font-size="10" fill="white" font-weight="700">low</text>
  <text x="255" y="170" text-anchor="middle" font-size="10" fill="#374151">'도움말' 버튼을 탭한다</text>
  <text x="375" y="170" text-anchor="middle" font-size="10" fill="#9CA3AF">—</text>
  <text x="480" y="170" text-anchor="middle" font-size="10" fill="#9CA3AF">—</text>
  <text x="572" y="170" text-anchor="middle" font-size="10" fill="#9CA3AF">—</text>
  <text x="700" y="170" text-anchor="middle" font-size="10" fill="#374151">도움말 팝업이 표시되어야 한다</text>
  <rect x="772" y="153" width="70" height="24" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="807" y="169" text-anchor="middle" font-size="10" fill="#9CA3AF">— ▾</text>

  <!-- Faded rows -->
  <rect x="0" y="180" width="900" height="30" fill="#FAFAFA"/>
  <rect x="0" y="210" width="900" height="30" fill="white"/>
  <rect x="0" y="240" width="900" height="30" fill="#FAFAFA"/>
  <rect x="0" y="270" width="900" height="60" fill="white"/>

  <!-- Fade overlay -->
  <rect x="0" y="210" width="900" height="120" fill="url(#fadeBottom)"/>

  <!-- Grid: horizontal -->
  <line x1="0" x2="900" y1="60"  y2="60"  stroke="#E2E8F0" stroke-width="1"/>
  <line x1="0" x2="900" y1="90"  y2="90"  stroke="#E2E8F0" stroke-width="1"/>
  <line x1="0" x2="900" y1="120" y2="120" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="0" x2="900" y1="150" y2="150" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="0" x2="900" y1="180" y2="180" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="0" x2="900" y1="210" y2="210" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Grid: vertical -->
  <line x1="36"  y1="36" x2="36"  y2="330" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="112" y1="36" x2="112" y2="330" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="190" y1="36" x2="190" y2="330" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="318" y1="36" x2="318" y2="330" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="432" y1="36" x2="432" y2="330" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="528" y1="36" x2="528" y2="330" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="618" y1="36" x2="618" y2="330" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="770" y1="36" x2="770" y2="330" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="848" y1="36" x2="848" y2="330" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Sheet tabs -->
  <rect x="0"   y="330" width="900" height="40" fill="#E2E8F0"/>
  <rect x="8"   y="334" width="86"  height="28" rx="6" fill="white"   stroke="#CBD5E1" stroke-width="1"/>
  <text x="51"  y="353" text-anchor="middle" font-size="11" fill="#374151" font-weight="600">summury</text>
  <rect x="102" y="334" width="110" height="28" rx="6" fill="#DBEAFE"  stroke="#93C5FD" stroke-width="1"/>
  <text x="157" y="353" text-anchor="middle" font-size="11" fill="#1D4ED8" font-weight="600">login_ios ▲</text>
  <rect x="220" y="334" width="128" height="28" rx="6" fill="#F1F5F9"  stroke="#E2E8F0" stroke-width="1"/>
  <text x="284" y="353" text-anchor="middle" font-size="11" fill="#9CA3AF">login_android</text>
  <rect x="356" y="334" width="100" height="28" rx="6" fill="#F1F5F9"  stroke="#E2E8F0" stroke-width="1"/>
  <text x="406" y="353" text-anchor="middle" font-size="11" fill="#9CA3AF">login_web</text>
  <rect x="464" y="334" width="98"  height="28" rx="6" fill="#F1F5F9"  stroke="#E2E8F0" stroke-width="1"/>
  <text x="513" y="353" text-anchor="middle" font-size="11" fill="#9CA3AF">home_ios</text>
  <text x="600" y="353" font-size="11" fill="#9CA3AF">+ 더 보기...</text>

  <!-- Legend -->
  <rect x="680" y="334" width="14" height="14" rx="3" fill="#E06666"/>
  <text x="698" y="346" font-size="10" fill="#374151">high</text>
  <rect x="730" y="334" width="14" height="14" rx="3" fill="#FFD966"/>
  <text x="748" y="346" font-size="10" fill="#374151">mid</text>
  <rect x="780" y="334" width="14" height="14" rx="3" fill="#93C47D"/>
  <text x="798" y="346" font-size="10" fill="#374151">low</text>
</svg>
